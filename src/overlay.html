<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; media-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'" />
  <title>Sipling</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <!-- Fullscreen, transparent, click-through stage. Nothing is visible until a
       reminder fires; then the buddy walks in from the configured edge. -->
  <div class="stage">
    <div id="buddy" class="buddy" data-corner="bottom-right" data-state="idle">
      <div class="bubble" id="bubble">
        <span id="bubbleMain">Time to drink some water! 💧</span>
        <small id="bubbleSub">Stay hydrated, you've got this.</small>
      </div>
      <div class="avatar-wrap" id="avatarWrap">
        <div class="emoji-buddy">🧑‍🚀</div>
      </div>
      <div class="progress" id="progress">0 / 8 glasses today</div>
      <div class="actions" id="actions">
        <button class="btn-drink" id="drink">I drank it 💧</button>
        <button class="btn-snooze" id="snooze">Snooze</button>
      </div>
    </div>
  </div>
  <audio id="ding" preload="auto">
    <source src="chime.mp3" type="audio/mpeg" />
  </audio>
  <script src="overlay.js"></script>
</body>
</html>
