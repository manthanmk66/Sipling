# Build the macOS .dmg and Windows .exe installers and attach them to a GitHub
# Release. Fires when you push a version tag, e.g.:
#   npm version patch && git push --follow-tags
# Each runner builds its own OS, then uploads its artifacts (installer + the
# electron-updater metadata) to the release with the gh CLI. Building and
# uploading are separate steps because electron-builder's own publisher times
# out on large artifacts.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build installers
        run: npx electron-builder --publish never
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          # Create the release once; the other matrix job may have created it already.
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Automated build of $GITHUB_REF_NAME." --verify-tag || true
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap dist/latest*.yml)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
