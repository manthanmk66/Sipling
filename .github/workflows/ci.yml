# Sanity check on every push / PR: install, syntax-check the main process,
# and make sure the icon generator runs. No build artifacts here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax-check source
        run: |
          for f in src/main.js src/preload.js src/store.js src/updater.js src/overlay.js src/settings.js; do
            node --check "$f"
          done
      - name: Generate icons
        run: npm run gen:icons
